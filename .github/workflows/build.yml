name: Build server plugin

on:
  push:
    branches:
      - main
      - arena/40874038-mcimage
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build plugin JAR
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        run: bash ./gradlew --no-daemon clean build

      - name: Upload server plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: MCImage-server-jar
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
